name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sizemod
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          # Скачиваем и устанавливаем нужную версию gradle напрямую через сам gradle
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export GRADLE_HOME=$PWD/gradle-8.2
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SizeMod-Jar
          path: sizemod/build/libs/*.jar
